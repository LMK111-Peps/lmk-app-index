name = "lmk-square"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Full catalog + inventory resync every 15 minutes (webhooks handle real-time stock).
[triggers]
crons = ["*/15 * * * *"]

# Create with: npx wrangler kv namespace create LMK_STORE  (then paste the id below)
[[kv_namespaces]]
binding = "LMK_STORE"
id = "9efa5ee158694995ac3100c47212b261"


[vars]
SQUARE_ENV = "sandbox"
SYNC_ONLY_MODE = "true"
SQUARE_LOCATION_ID = "L4W08STADYAXB"
ALLOWED_ORIGINS = "https://labortorimassakritikal.com"
CHECKOUT_REDIRECT_URL = "https://labortorimassakritikal.com/order-complete"
SQUARE_WEBHOOK_URL = "https://lmk-square.REPLACE.workers.dev/api/square/webhook"
# Payment safety switches
CHECKOUT_ENABLED = "false"
LIVE_PAYMENTS_APPROVED = "false"

# Cloudflare Worker secrets — never place actual values here:
# SQUARE_ACCESS_TOKEN
# SQUARE_WEBHOOK_SIGNATURE_KEY
# ADMIN_TOKEN

