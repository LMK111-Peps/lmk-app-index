
/**
 * Calculate cart totals using Square's Orders API.
 *
 * Prices come from the Square catalog.
 * Square automatically applies catalog taxes.
 * This function does not create an order or payment.
 */
export async function quoteCart(
  env: Env,
  lines: CartLine[]
): Promise<{
  lines: CheckedLine[];
  total: Money;
  tax: Money;
  checkout: ReturnType<typeof checkoutState>;
}> {

  // Validate products and current inventory.
  const checked = await validateCart(env, lines);

  // Calculate the order using Square.
  const res = await square<{
    order: {
      total_money: Money;
      total_tax_money: Money;
    };
  }>(
    env,
    'POST',
    '/v2/orders/calculate',
    {
      order: {
        location_id: env.SQUARE_LOCATION_ID,

        line_items: checked.map((line) => ({
          catalog_object_id: line.variationId,
          quantity: String(line.quantity),
        })),

        // Automatically calculate catalog taxes.
        pricing_options: {
          auto_apply_taxes: true,
        },
      },
    }
  );

  // Return the calculated totals.
  return {
    lines: checked,
    total: res.order.total_money,
    tax: res.order.total_tax_money,
    checkout: checkoutState(env),
  };
}

