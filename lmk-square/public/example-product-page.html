<!doctype html>
<!--
  EXAMPLE MARKUP ONLY. Shows where the data attributes go on your EXISTING LMK product cards and cart.
  Keep your own HTML/CSS; just add the data-lmk-* attributes and the script tag.
  The demo stub at the bottom fakes the Worker with clearly labelled example data so this page
  can be opened locally. Delete that stub on your real site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMK connector example</title>
<style>
  :root { --black:#0b0b0b; --panel:#141414; --gold:#c9a24a; --gold-soft:#e6c878; --ink:#f3efe6; --muted:#a39d90; --line:#2a2722; }
  * { box-sizing:border-box } body { margin:0; background:var(--black); color:var(--ink); font-family: Georgia, "Times New Roman", serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:20px 32px; border-bottom:1px solid var(--line); }
  .brand { letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-size:15px }
  .cart-pill { border:1px solid var(--gold); color:var(--gold); padding:6px 14px; border-radius:999px; font-family:system-ui,sans-serif; font-size:14px }
  .banner { margin:16px 32px 0; padding:10px 14px; border:1px dashed var(--gold); color:var(--gold-soft); font:13px system-ui,sans-serif }
  main { display:grid; grid-template-columns: 2fr 1fr; gap:28px; padding:28px 32px; } @media (max-width:860px){ main{grid-template-columns:1fr} }
  .products { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px }
  .card { background:var(--panel); border:1px solid var(--line); padding:18px; display:grid; gap:10px }
  .card .img { aspect-ratio:1; background:radial-gradient(circle at 50% 40%, #2b2618, #0f0f0f); border:1px solid var(--line); display:grid; place-items:center; color:var(--gold); font-size:13px; letter-spacing:.12em }
  .card h3 { margin:4px 0 0; font-weight:normal; font-size:20px }
  .row { display:flex; justify-content:space-between; align-items:center; font-family:system-ui,sans-serif; font-size:14px }
  .price { color:var(--gold); font-size:18px } .stock { color:var(--muted) }
  select, input { background:#0f0f0f; color:var(--ink); border:1px solid var(--line); padding:8px; font:14px system-ui,sans-serif; width:100% }
  .controls { display:grid; grid-template-columns:1fr 70px; gap:8px }
  button { font:600 14px system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase; padding:11px; border:1px solid var(--gold); background:var(--gold); color:#111; cursor:pointer }
  button:disabled { background:transparent; color:var(--muted); border-color:var(--line); cursor:not-allowed }
  aside { background:var(--panel); border:1px solid var(--line); padding:20px; align-self:start; font-family:system-ui,sans-serif }
  aside h2 { font-family:Georgia,serif; font-weight:normal; color:var(--gold); margin:0 0 12px }
  .lmk-cart-line { display:grid; grid-template-columns:40px 1fr 54px auto 24px; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px }
  .lmk-cart-line:not(:has(.lmk-cart-img)) { grid-template-columns:1fr 54px auto 24px }
  .lmk-cart-img { width:40px; height:40px; object-fit:cover } .lmk-cart-info { display:grid } .lmk-cart-strength { color:var(--muted); font-size:12px }
  .lmk-cart-remove { padding:2px; background:none; border:0; color:var(--muted); font-size:18px } .lmk-cart-qty { padding:4px }
  .totals { display:grid; gap:6px; margin:14px 0; font-size:14px } .totals div { display:flex; justify-content:space-between } .totals .grand { color:var(--gold); font-size:17px }
  .msg { color:var(--gold-soft); font-size:13px; min-height:1em }
</style>
</head>
<body>
<header><span class="brand">Laboratori Massa Kritikal</span><span class="cart-pill">Cart · <span data-lmk-cart-count>0</span></span></header>
<div class="banner">Example page. Products, strengths, prices, and stock below are EXAMPLE DATA and aren't from your Square account.</div>
<main>
  <section class="products">
    <article class="card" data-lmk-product="Example Compound A">
      <div class="img">PRODUCT IMAGE</div>
      <h3>Example Compound A</h3>
      <div class="row"><span class="price" data-lmk-price></span><span class="stock" data-lmk-stock></span></div>
      <div class="controls"><select data-lmk-strength aria-label="Strength"></select><input data-lmk-qty type="number" min="1" value="1" aria-label="Quantity"></div>
      <button data-lmk-add>Add to cart</button>
    </article>
    <article class="card" data-lmk-product="Example Compound B">
      <div class="img">PRODUCT IMAGE</div>
      <h3>Example Compound B</h3>
      <div class="row"><span class="price" data-lmk-price></span><span class="stock" data-lmk-stock></span></div>
      <div class="controls"><select data-lmk-strength aria-label="Strength"></select><input data-lmk-qty type="number" min="1" value="1" aria-label="Quantity"></div>
      <button data-lmk-add>Add to cart</button>
    </article>
  </section>
  <aside>
    <h2>Your cart</h2>
    <div data-lmk-cart-lines></div>
    <div class="totals">
      <div><span>Subtotal</span><span data-lmk-cart-subtotal></span></div>
      <div><span>Tax</span><span data-lmk-cart-tax></span></div>
      <div class="grand"><span>Total</span><span data-lmk-cart-total></span></div>
    </div>
    <p class="msg" data-lmk-cart-message></p>
    <button data-lmk-checkout style="width:100%">Checkout</button>
  </aside>
</main>

<!-- DEMO STUB: fakes the Worker with example data. Remove on your real site. -->
<script>
(function () {
  var demo = { syncedAt: new Date().toISOString(), environment: 'sandbox', locationId: 'EXAMPLE', checkout: { enabled: false, reason: 'checkout_disabled' }, products: [
    { id: 'EX_A', name: 'Example Compound A', description: '', images: [], variations: [
      { id: 'EX_A5', name: '5 mg', sku: null, price: { amount: 4500, currency: 'USD' }, trackInventory: true, stock: 12, available: true },
      { id: 'EX_A10', name: '10 mg', sku: null, price: { amount: 7900, currency: 'USD' }, trackInventory: true, stock: 3, available: true } ] },
    { id: 'EX_B', name: 'Example Compound B', description: '', images: [], variations: [
      { id: 'EX_B2', name: '2 mg', sku: null, price: { amount: 3200, currency: 'USD' }, trackInventory: true, stock: 0, available: false },
      { id: 'EX_B5', name: '5 mg', sku: null, price: { amount: 6500, currency: 'USD' }, trackInventory: true, stock: 8, available: true } ] } ] };
  var real = window.fetch;
  window.fetch = function (url, opts) {
    url = String(url);
    if (url.indexOf('/api/catalog') >= 0) return Promise.resolve(new Response(JSON.stringify(demo)));
    if (url.indexOf('/api/cart/quote') >= 0) {
      var lines = JSON.parse(opts.body).lines, idx = {};
      demo.products.forEach(function (p) { p.variations.forEach(function (v) { idx[v.id] = { p: p, v: v }; }); });
      var out = lines.map(function (l) { var h = idx[l.variationId]; return { variationId: l.variationId, productName: h.p.name, strength: h.v.name, quantity: l.quantity, unitPrice: h.v.price }; });
      var sub = out.reduce(function (n, l) { return n + l.unitPrice.amount * l.quantity; }, 0);
      return Promise.resolve(new Response(JSON.stringify({ lines: out, tax: { amount: 0, currency: 'USD' }, total: { amount: sub, currency: 'USD' }, checkout: demo.checkout })));
    }
    return real.apply(this, arguments);
  };
})();
</script>
<script src="lmk-square.js" data-api="" defer></script>
</body>
</html>
